name: CI - Run Tests on Pull Requests

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    # All commands run in the bug_tracker/ folder
    defaults:
      run:
        working-directory: bug_tracker

    env:
      # Minimal environment vars so Flask works in test mode
      FLASK_ENV: testing
      SECRET_KEY: dummy-secret-key
      # Optional: force SQLAlchemy to use an isolated sqlite test DB
      DATABASE_URL: sqlite:///test_ci.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q
