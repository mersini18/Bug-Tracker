{% extends "base.html" %}

{% block title %}Update User{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Update User</h2>
    <form action="{{ url_for('admin.update_user_form', user_id=user.id) }}" method="POST" class="p-4 border rounded bg-light">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" value="{{ user.username }}" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ user.email }}" required>
        </div>
        <div class="mb-3">
            <label for="role" class="form-label">Role</label>
            <select id="role" name="role" class="form-select" required>
                <option value="user" {% if user.role == 'user' %}selected{% endif %}>User</option>
                <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">New Password (Leave blank to keep unchanged)</label>
            <input type="password" id="password" name="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary w-100">Update User</button>
    </form>
    <div class="text-center mt-3">
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">Back to Admin Dashboard</a>
    </div>
</div>
{% endblock %}
